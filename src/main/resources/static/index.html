<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>growatt-server</title>
<style>
:root {
  --bg:     #0d1117;
  --surf:   #161b22;
  --surf2:  #21262d;
  --border: #30363d;
  --solar:  #f59e0b;
  --green:  #22c55e;
  --red:    #f87171;
  --blue:   #3b82f6;
  --purple: #a78bfa;
  --text:   #e6edf3;
  --muted:  #7d8590;
  --r: 12px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
       background: var(--bg); color: var(--text); min-height: 100vh; }

/* ── header ─────────────────────────────────────────────────────────────── */
header {
  border-bottom: 1px solid var(--border);
  padding: 14px 24px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0;
  background: rgba(13,17,23,.93);
  backdrop-filter: blur(8px);
  z-index: 100;
}
.logo { font-size: 1.05rem; font-weight: 700; color: var(--solar);
        display: flex; align-items: center; gap: 8px; }
.header-right { display: flex; align-items: center; gap: 12px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: .75rem;
        color: var(--muted); background: var(--surf2); border: 1px solid var(--border);
        border-radius: 20px; padding: 3px 10px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
.dot.live  { background: var(--green); animation: blink 1.5s ease-in-out infinite; }
.dot.on    { background: var(--green); box-shadow: 0 0 5px var(--green); }
.dot.warn  { background: var(--solar); }
.dot.err   { background: var(--red); }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }

/* ── main grid ───────────────────────────────────────────────────────────── */
main { padding: 24px; display: grid; gap: 20px;
       grid-template-columns: repeat(auto-fill, minmax(500px, 1fr)); }

/* ── inverter card ───────────────────────────────────────────────────────── */
.card { background: var(--surf); border: 1px solid var(--border); border-radius: var(--r); padding: 24px; }
.card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.device-id { font-size: .8rem; color: var(--muted); font-family: monospace; }
.badge { font-size: .7rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
.badge-normal  { background: #052e16; color: #4ade80; border: 1px solid #166534; }
.badge-waiting { background: var(--surf2); color: var(--muted); border: 1px solid var(--border); }
.badge-fault   { background: #450a0a; color: var(--red); border: 1px solid #7f1d1d; }

/* flow SVG */
.flow-svg { width: 100%; height: auto; display: block; margin-bottom: 20px; }

/* ── stat cards ──────────────────────────────────────────────────────────── */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat-card { background: var(--surf2); border: 1px solid var(--border); border-radius: var(--r); padding: 14px; text-align: center; }
.stat-lbl  { font-size: .7rem; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .05em; }
.stat-val  { font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat-val span { font-size: .75rem; color: var(--muted); margin-left: 1px; }

/* ── non-SPH hero ────────────────────────────────────────────────────────── */
.power-hero { display: flex; align-items: flex-end; gap: 20px; margin-bottom: 20px; }
.power-block { flex: 1; }
.power-label { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 2px; }
.power-value { font-size: 2.1rem; font-weight: 700; color: var(--text); line-height: 1; }
.power-sub   { font-size: .85rem; color: var(--muted); margin-top: 2px; }
.section-title { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 14px 0 8px; }
.grid2  { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.metric { background: var(--surf2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
.metric-label { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
.metric-value { font-size: 1rem; font-weight: 600; color: var(--text); }
.metric-value small { font-weight: 400; font-size: .75rem; color: var(--muted); }
.strings     { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.string-card { background: var(--surf2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
.string-name   { font-size: .7rem; color: var(--muted); margin-bottom: 4px; }
.string-watt   { font-size: 1rem; font-weight: 600; color: var(--solar); }
.string-detail { font-size: .75rem; color: var(--muted); margin-top: 2px; }

.timestamp { font-size: .7rem; color: var(--muted); text-align: right; }

/* ── empty state ─────────────────────────────────────────────────────────── */
#no-data { grid-column: 1/-1; text-align: center; padding: 5rem; color: var(--muted); }
#no-data h2 { font-size: 1.1rem; margin-bottom: 8px; color: var(--text); }
#no-data p  { font-size: .875rem; }

@media (max-width: 560px) {
  main { padding: 16px; grid-template-columns: 1fr; }
  header { padding: 12px 16px; }
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
    </svg>
    growatt-server
  </div>
  <div class="header-right">
    <div class="pill" id="mqtt-badge" hidden>
      <span class="dot" id="mqtt-dot"></span>
      <span id="mqtt-text">MQTT</span>
    </div>
    <div class="pill">
      <span class="dot" id="status-dot"></span>
      <span id="last-update">connecting…</span>
    </div>
  </div>
</header>

<main id="cards">
  <div id="no-data">
    <h2>No inverter data yet</h2>
    <p>Waiting for datalogger connection on port 5279…</p>
  </div>
</main>

<script>
const STATUS = {
  0: ['Waiting','waiting'], 1: ['Normal','normal'],
  3: ['Fault','fault'],     5: ['Waiting','waiting']
};

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmt(val, unit, digits = 1) {
  if (val == null || val === '') return '—';
  return (+val).toFixed(digits) + ' ' + unit;
}
function kw(w) {
  if (w == null) return '—';
  const v = +w;
  return v >= 1000 ? (v / 1000).toFixed(2) + '‬kW' : v.toFixed(0) + '‬W';
}
function fmtW(w) {
  if (!w || +w === 0) return '—‬W';
  const v = +w;
  return v >= 1000 ? (v / 1000).toFixed(2) + '‬kW' : Math.round(v) + '‬W';
}

// ── 5-node power flow SVG (SPH inverters with battery) ────────────────────

function renderFlowDiagram(inv) {
  const pvPow  = +(inv.pvpowerin   ?? 0);
  const impPow = +(inv.pactouserr  ?? 0);
  const expPow = +(inv.pactogridr  ?? 0);
  const chrPow = +(inv.p1charge1   ?? 0);
  const disPow = +(inv.pdischarge1 ?? 0);
  const load   = +(inv.plocaloadr  ?? 0);
  const soc    = +(inv.SOC ?? 0);

  const T = 15;
  const pvOn  = pvPow  > T;
  const impOn = impPow > T;
  const expOn = expPow > T;
  const chrOn = chrPow > T;
  const disOn = disPow > T;

  const socColor    = soc > 50 ? '#22c55e' : soc > 20 ? '#f59e0b' : '#ef4444';
  const gridColor   = impOn ? '#f87171' : expOn ? '#22c55e' : '#30363d';
  const batColor    = chrOn ? '#3b82f6' : disOn ? '#22c55e' : '#30363d';
  const batPow      = chrOn ? '+' + fmtW(chrPow) : disOn ? '-' + fmtW(disPow) : '';
  const batPowColor = chrOn ? '#3b82f6' : '#22c55e';

  const [statusLabel] = STATUS[inv.pvstatus] ?? ['Unknown'];
  const statusColor = inv.pvstatus === 1 ? '#22c55e' : inv.pvstatus === 3 ? '#f87171' : '#7d8590';

  // Unique path IDs per device (safe for multiple cards)
  const uid = escHtml(inv.deviceId).replace(/[^a-z0-9]/gi, '_');

  const dots = (path, fill, dur, count = 3) =>
    Array.from({length: count}, (_, i) =>
      `<circle r="5" fill="${fill}" opacity=".9"><animateMotion dur="${dur}s" repeatCount="indefinite" begin="${(i * dur / count).toFixed(2)}s"><mpath href="#${path}"/></animateMotion></circle>`
    ).join('');

  return `
  <svg class="flow-svg" viewBox="0 0 720 270" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <path id="pv-${uid}"       d="M 155,68  C 210,68  245,115 280,120"/>
      <path id="load-${uid}"     d="M 440,120 C 475,115 510,68  565,68"/>
      <path id="bat-${uid}"      d="M 300,175 C 260,200  200,210 155,210"/>
      <path id="bat-rev-${uid}"  d="M 155,210 C 200,210  260,200 300,175"/>
      <path id="grid-${uid}"     d="M 420,175 C 460,200  520,210 565,210"/>
      <path id="grid-rev-${uid}" d="M 565,210 C 520,210  460,200 420,175"/>
    </defs>

    <!-- static lines -->
    <use href="#pv-${uid}"   fill="none" stroke="#30363d" stroke-width="2.5"/>
    <use href="#load-${uid}" fill="none" stroke="#30363d" stroke-width="2.5"/>
    <use href="#bat-${uid}"  fill="none" stroke="#30363d" stroke-width="2.5"/>
    <use href="#grid-${uid}" fill="none" stroke="#30363d" stroke-width="2.5"/>

    <!-- PV → Inverter -->
    ${pvOn  ? dots(`pv-${uid}`,       '#f59e0b', 1.3) : ''}
    <!-- Inverter → Load (always, load is always present) -->
    ${load > T ? dots(`load-${uid}`,  '#a78bfa', 1.5) : ''}
    <!-- Battery charging -->
    ${chrOn ? dots(`bat-${uid}`,      '#3b82f6', 2.2) : ''}
    <!-- Battery discharging -->
    ${disOn ? dots(`bat-rev-${uid}`,  '#22c55e', 2.2) : ''}
    <!-- Grid export -->
    ${expOn ? dots(`grid-${uid}`,     '#22c55e', 2.0, 2) : ''}
    <!-- Grid import -->
    ${impOn ? dots(`grid-rev-${uid}`, '#f87171', 2.0, 2) : ''}

    <!-- PV node -->
    <rect x="22" y="22" width="133" height="90" rx="10" fill="#161b22" stroke="${pvOn ? '#f59e0b' : '#30363d'}" stroke-width="2"/>
    <text x="88"  y="53" text-anchor="middle" font-size="26">☀️</text>
    <text x="88"  y="76" text-anchor="middle" fill="#7d8590"  font-size="11" font-family="sans-serif" letter-spacing=".05em">PV POWER</text>
    <text x="88"  y="97" text-anchor="middle" fill="#f59e0b"  font-size="15" font-weight="700" font-family="monospace">${fmtW(pvPow)}</text>

    <!-- Inverter node (center) -->
    <rect x="260" y="88" width="200" height="88" rx="10" fill="#161b22" stroke="#f59e0b" stroke-width="2"/>
    <text x="360" y="116" text-anchor="middle" fill="#7d8590"       font-size="11" font-family="sans-serif" letter-spacing=".05em">INVERTER</text>
    <text x="360" y="138" text-anchor="middle" fill="#e6edf3"       font-size="13" font-family="monospace">${escHtml(inv.deviceId)}</text>
    <text x="360" y="159" text-anchor="middle" fill="${statusColor}" font-size="11" font-family="sans-serif">&#x25cf; ${statusLabel.toUpperCase()}</text>

    <!-- Load / Home node -->
    <rect x="565" y="22" width="133" height="90" rx="10" fill="#161b22" stroke="#a78bfa" stroke-width="2"/>
    <text x="631" y="53" text-anchor="middle" font-size="26">🏠</text>
    <text x="631" y="76" text-anchor="middle" fill="#7d8590"  font-size="11" font-family="sans-serif" letter-spacing=".05em">LOAD</text>
    <text x="631" y="97" text-anchor="middle" fill="#a78bfa"  font-size="15" font-weight="700" font-family="monospace">${fmtW(load)}</text>

    <!-- Battery node -->
    <rect x="22" y="162" width="133" height="90" rx="10" fill="#161b22" stroke="${socColor}" stroke-width="2"/>
    <text x="88"  y="190" text-anchor="middle" font-size="20">🔋</text>
    <text x="88"  y="207" text-anchor="middle" fill="#7d8590"    font-size="10" font-family="sans-serif" letter-spacing=".05em">BATTERY</text>
    <text x="88"  y="224" text-anchor="middle" fill="${socColor}" font-size="14" font-weight="700" font-family="monospace">${soc}%</text>
    ${batPow ? `<text x="88" y="244" text-anchor="middle" fill="${batPowColor}" font-size="11" font-family="monospace">${batPow}</text>` : ''}

    <!-- Grid node -->
    <rect x="565" y="162" width="133" height="90" rx="10" fill="#161b22" stroke="${gridColor}" stroke-width="2"/>
    <text x="631" y="193" text-anchor="middle" font-size="26">⚡</text>
    <text x="631" y="216" text-anchor="middle" fill="#7d8590"    font-size="11" font-family="sans-serif" letter-spacing=".05em">${impOn ? 'IMPORT' : expOn ? 'EXPORT' : 'GRID'}</text>
    <text x="631" y="237" text-anchor="middle" fill="${gridColor}" font-size="15" font-weight="700" font-family="monospace">${fmtW(impOn ? impPow : expPow)}</text>
  </svg>`;
}

// ── 8 stat cards (SPH) ────────────────────────────────────────────────────

function renderStatCards(inv) {
  const freq     = inv.pvfrequentie ?? inv.pvfrequency ?? null;
  const temp     = inv.pvtemperature ?? null;
  const pvToday  = inv.pvenergytoday ?? inv.eactoday ?? null;
  const pvTotal  = inv.pvenergytotal ?? inv.eactotal ?? null;

  function card(lbl, val, unit, color) {
    return `<div class="stat-card">
      <div class="stat-lbl">${lbl}</div>
      <div class="stat-val" style="color:${color}">${val}<span>${unit}</span></div>
    </div>`;
  }

  const pv1v = inv.pv1voltage != null ? (+inv.pv1voltage).toFixed(0) : '—';
  const pv2v = inv.pv2voltage != null ? (+inv.pv2voltage).toFixed(0) : '—';
  const gv   = inv.pvgridvoltage != null ? (+inv.pvgridvoltage).toFixed(0) : '—';
  const fr   = freq != null ? (+freq).toFixed(1) : '—';
  const tp   = temp != null ? (+temp).toFixed(0) : '—';
  const td   = pvToday != null ? (+pvToday).toFixed(1) : '—';
  const tot  = pvTotal != null ? (+pvTotal).toFixed(0) : '—';
  const soc  = inv.SOC != null ? (+inv.SOC).toFixed(0) : '—';

  return `<div class="stat-grid">
    ${card('PV String 1',    pv1v, 'V',   'var(--solar)')}
    ${card('PV String 2',    pv2v, 'V',   'var(--solar)')}
    ${card('Grid Voltage',   gv,   'V',   'var(--text)')}
    ${card('Grid Frequency', fr,   'Hz',  'var(--text)')}
    ${card('Temperature',    tp,   '°C',  'var(--text)')}
    ${card('Energy Today',   td,   'kWh', 'var(--green)')}
    ${card('Energy Total',   tot,  'kWh', 'var(--green)')}
    ${card('Battery SOC',    soc,  '%',   'var(--blue)')}
  </div>`;
}

// ── Non-SPH card body ─────────────────────────────────────────────────────

function renderNonSph(inv) {
  const pvPower  = inv.pvpowerin  ?? null;
  const outPower = inv.pvpowerout ?? inv.pvgridpower ?? null;
  const freq     = inv.pvfrequentie ?? inv.pvfrequency ?? null;
  const temp     = inv.pvtemperature ?? null;
  const loadPow  = inv.plocaloadr ?? null;

  const strings = [1, 2].map(i => {
    const v = inv[`pv${i}voltage`], w = inv[`pv${i}watt`], a = inv[`pv${i}current`];
    if (!v && !w) return '';
    return `<div class="string-card">
      <div class="string-name">String ${i}</div>
      <div class="string-watt">${kw(w)}</div>
      <div class="string-detail">${fmt(v,'V')} &middot; ${fmt(a,'A')}</div>
    </div>`;
  }).join('');

  const phases = [
    ['L1', inv.pvgridvoltage,  inv.pvgridcurrent,  inv.pvgridpower],
    ['L2', inv.pvgridvoltage2, inv.pvgridcurrent2, inv.pvgridpower2],
    ['L3', inv.pvgridvoltage3, inv.pvgridcurrent3, inv.pvgridpower3],
  ].filter(([,v]) => v != null && +v !== 0).map(([lbl,v,a,p]) =>
    `<div class="metric"><div class="metric-label">${lbl}</div>
     <div class="metric-value">${fmt(v,'V')} <small>/ ${fmt(a,'A')}</small></div>
     <div style="font-size:.75rem;color:var(--muted)">${kw(p)}</div></div>`
  ).join('');

  return `
    <div class="power-hero">
      <div class="power-block">
        <div class="power-label">PV input</div>
        <div class="power-value">${kw(pvPower)}</div>
        <div class="power-sub">${kw(outPower)} to grid</div>
      </div>
      <div class="power-block" style="text-align:right">
        <div class="power-label">${loadPow != null ? 'Load' : 'Grid out'}</div>
        <div class="power-value" style="font-size:1.5rem">${kw(loadPow ?? outPower)}</div>
        <div class="power-sub">${fmt(temp,'°C')} &nbsp; ${fmt(freq,'Hz',2)}</div>
      </div>
    </div>
    ${strings ? `<div class="section-title">PV Strings</div><div class="strings">${strings}</div>` : ''}
    ${phases   ? `<div class="section-title">Grid</div><div class="grid2">${phases}</div>` : ''}`;
}

// ── Card renderer ─────────────────────────────────────────────────────────

function renderCard(inv) {
  const [statusLabel, statusClass] = STATUS[inv.pvstatus] ?? ['Unknown', 'waiting'];
  const hasSPH = inv.SOC != null;
  const ts = new Date(inv.timestamp).toLocaleTimeString();

  return `<div class="card">
    <div class="card-header">
      <div class="device-id">${escHtml(inv.deviceId)}</div>
      <span class="badge badge-${statusClass}">${statusLabel}</span>
    </div>
    ${hasSPH ? renderFlowDiagram(inv) + renderStatCards(inv) : renderNonSph(inv)}
    <div class="timestamp">Updated ${escHtml(ts)}${inv.buffered ? ' &middot; buffered' : ''}</div>
  </div>`;
}

// ── Dashboard poll ────────────────────────────────────────────────────────

async function refresh() {
  try {
    const res  = await fetch('/api/dashboard');
    const data = await res.json();
    document.getElementById('status-dot').className = 'dot live';
    document.getElementById('last-update').textContent = new Date().toLocaleTimeString();
    const cards = document.getElementById('cards');
    cards.innerHTML = data.inverters.length
      ? data.inverters.map(renderCard).join('')
      : '<div id="no-data"><h2>No inverter data yet</h2><p>Waiting for datalogger connection on port 5279…</p></div>';
  } catch {
    document.getElementById('status-dot').className = 'dot err';
    document.getElementById('last-update').textContent = 'connection error';
  }
}

// ── MQTT status badge ─────────────────────────────────────────────────────

async function refreshMqtt() {
  try {
    const res  = await fetch('/api/config/mqtt');
    const data = await res.json();
    const badge = document.getElementById('mqtt-badge');
    const dot   = document.getElementById('mqtt-dot');
    const text  = document.getElementById('mqtt-text');
    if (!data.enabled) { badge.hidden = true; return; }
    badge.hidden = false;
    dot.className    = data.connected ? 'dot on' : 'dot warn';
    text.textContent = data.connected
      ? 'MQTT • ' + data.host + ':' + data.port
      : 'MQTT • disconnected';
  } catch { /* server not yet ready */ }
}

refresh();
refreshMqtt();
setInterval(refresh,      5000);
setInterval(refreshMqtt, 15000);
</script>
</body>
</html>
