<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>grottserver</title>
<style>
:root {
  --bg:     #0d1117;
  --surf:   #161b22;
  --surf2:  #21262d;
  --border: #30363d;
  --solar:  #f59e0b;
  --green:  #22c55e;
  --red:    #f87171;
  --blue:   #3b82f6;
  --text:   #e6edf3;
  --muted:  #7d8590;
  --r: 12px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
       background: var(--bg); color: var(--text); min-height: 100vh; }

/* ── header ─────────────────────────────────────────────────────────────── */
header {
  border-bottom: 1px solid var(--border);
  padding: 14px 24px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0;
  background: rgba(13,17,23,.93);
  backdrop-filter: blur(8px);
  z-index: 100;
}
.logo { font-size: 1.05rem; font-weight: 700; color: var(--solar);
        display: flex; align-items: center; gap: 8px; }
.header-right { display: flex; align-items: center; gap: 12px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: .75rem;
        color: var(--muted); background: var(--surf2); border: 1px solid var(--border);
        border-radius: 20px; padding: 3px 10px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
.dot.live  { background: var(--green); animation: blink 1.5s ease-in-out infinite; }
.dot.on    { background: var(--green); box-shadow: 0 0 5px var(--green); }
.dot.warn  { background: var(--solar); }
.dot.err   { background: var(--red); }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }

/* ── main grid ───────────────────────────────────────────────────────────── */
main { padding: 24px; display: grid; gap: 20px;
       grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); }

/* ── inverter card ───────────────────────────────────────────────────────── */
.card { background: var(--surf); border: 1px solid var(--border); border-radius: var(--r); padding: 24px; }
.card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.device-id { font-size: .8rem; color: var(--muted); font-family: monospace; }
.badge { font-size: .7rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
.badge-normal  { background: #052e16; color: #4ade80; border: 1px solid #166534; }
.badge-waiting { background: var(--surf2); color: var(--muted); border: 1px solid var(--border); }
.badge-fault   { background: #450a0a; color: var(--red); border: 1px solid #7f1d1d; }

/* power hero (non-SPH) */
.power-hero { display: flex; align-items: flex-end; gap: 20px; margin-bottom: 20px; }
.power-block { flex: 1; }
.power-label { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 2px; }
.power-value { font-size: 2.1rem; font-weight: 700; color: var(--text); line-height: 1; }
.power-sub   { font-size: .85rem; color: var(--muted); margin-top: 2px; }

/* section labels */
.section-title { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 16px 0 8px; }

/* energy today */
.energy-row  { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 12px; }
.energy-tile { background: var(--surf2); border: 1px solid var(--border); border-radius: 8px;
               padding: 10px 8px; text-align: center; }
.energy-icon { font-size: 1rem; margin-bottom: 2px; }
.energy-val  { font-size: .95rem; font-weight: 600; color: var(--text); }
.energy-lbl  { font-size: .65rem; color: var(--muted); text-transform: uppercase;
               letter-spacing: .04em; margin-top: 2px; }

/* metric grid */
.grid2   { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.metric  { background: var(--surf2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
.metric-label { font-size: .7rem; color: var(--muted); text-transform: uppercase;
                letter-spacing: .04em; margin-bottom: 2px; }
.metric-value { font-size: 1rem; font-weight: 600; color: var(--text); }
.metric-value small { font-weight: 400; font-size: .75rem; color: var(--muted); }

/* PV strings */
.strings     { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.string-card { background: var(--surf2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
.string-name   { font-size: .7rem; color: var(--muted); margin-bottom: 4px; }
.string-watt   { font-size: 1rem; font-weight: 600; color: var(--solar); }
.string-detail { font-size: .75rem; color: var(--muted); margin-top: 2px; }

.timestamp { font-size: .7rem; color: var(--muted); margin-top: 16px; text-align: right; }

/* flow animation */
@keyframes flowDash { to { stroke-dashoffset: 0; } }

/* empty state */
#no-data { grid-column: 1/-1; text-align: center; padding: 5rem; color: var(--muted); }
#no-data h2 { font-size: 1.1rem; margin-bottom: 8px; color: var(--text); }
#no-data p  { font-size: .875rem; }

@media (max-width: 480px) {
  main { padding: 16px; grid-template-columns: 1fr; }
  header { padding: 12px 16px; }
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
    </svg>
    grottserver
  </div>
  <div class="header-right">
    <div class="pill" id="mqtt-badge" hidden>
      <span class="dot" id="mqtt-dot"></span>
      <span id="mqtt-text">MQTT</span>
    </div>
    <div class="pill">
      <span class="dot" id="status-dot"></span>
      <span id="last-update">connecting…</span>
    </div>
  </div>
</header>

<main id="cards">
  <div id="no-data">
    <h2>No inverter data yet</h2>
    <p>Waiting for datalogger connection on port 5279…</p>
  </div>
</main>

<script>
const STATUS = {
  0: ['Waiting','waiting'], 1: ['Normal','normal'],
  3: ['Fault','fault'],     5: ['Waiting','waiting']
};

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmt(val, unit, digits = 1) {
  if (val == null || val === '') return '—';
  return (+val).toFixed(digits) + ' ' + unit;
}

function kw(w) {
  if (w == null) return '—';
  const v = +w;
  return v >= 1000 ? (v / 1000).toFixed(2) + ' kW' : v.toFixed(0) + ' W';
}

function pw(w) {
  if (!w || +w === 0) return '';
  const v = +w;
  return v >= 1000 ? (v / 1000).toFixed(1) + 'kW' : Math.round(v) + 'W';
}

// ── Power flow SVG diagram (SPH) ──────────────────────────────────────────

function renderFlowDiagram(inv) {
  if (inv.SOC == null) return '';

  const pvPow  = +(inv.pvpowerin   ?? 0);
  const impPow = +(inv.pactouserr  ?? 0);
  const expPow = +(inv.pactogridr  ?? 0);
  const chrPow = +(inv.p1charge1   ?? 0);
  const disPow = +(inv.pdischarge1 ?? 0);
  const load   = +(inv.plocaloadr  ?? 0);
  const soc    = +inv.SOC;

  const T = 15;
  const pvOn  = pvPow  > T;
  const impOn = impPow > T;
  const expOn = expPow > T;
  const chrOn = chrPow > T;
  const disOn = disPow > T;
  const gridActive = impOn || expOn;
  const batActive  = chrOn || disOn;

  const socColor  = soc > 50 ? '#22c55e' : soc > 20 ? '#f59e0b' : '#ef4444';
  const gridColor = impOn ? '#60a5fa' : expOn ? '#34d399' : '#30363d';
  const batColor  = chrOn ? '#f59e0b' : disOn ? '#34d399' : '#30363d';

  function line(active, color, rev) {
    if (!active) return `stroke="${color}" stroke-dasharray="3 5" opacity="0.3"`;
    return `stroke="${color}" stroke-width="2.5" stroke-dasharray="7 4" stroke-dashoffset="11"
            style="animation:flowDash .65s linear infinite${rev ? ' reverse' : ''}"`;
  }

  const gridLabel = pw(impOn ? impPow : expPow);
  const batLabel  = pw(chrOn ? chrPow : disPow);

  return `<svg viewBox="0 0 300 172" xmlns="http://www.w3.org/2000/svg"
               style="width:100%;display:block;margin-bottom:4px">

    <!-- lines -->
    <line x1="150" y1="51" x2="150" y2="97" stroke-width="2.5"
          ${line(pvOn, pvOn ? '#f59e0b' : '#30363d', false)}/>
    ${pw(pvPow) ? `<text x="155" y="78" fill="#f59e0b" font-size="9.5" font-family="sans-serif">${pw(pvPow)}</text>` : ''}

    <line x1="76"  y1="120" x2="113" y2="120" stroke-width="2.5"
          ${line(gridActive, gridColor, expOn && !impOn)}/>
    ${gridLabel ? `<text x="${93 - gridLabel.length * 2.8}" y="114" fill="${gridColor}" font-size="9.5" font-family="sans-serif">${gridLabel}</text>` : ''}

    <line x1="187" y1="120" x2="224" y2="120" stroke-width="2.5"
          ${line(batActive, batColor, disOn && !chrOn)}/>
    ${batLabel ? `<text x="${205 - batLabel.length * 2.8}" y="114" fill="${batColor}" font-size="9.5" font-family="sans-serif">${batLabel}</text>` : ''}

    <!-- Solar -->
    <rect x="110" y="5" width="80" height="46" rx="8"
          fill="#161b22" stroke="${pvOn ? '#f59e0b' : '#30363d'}" stroke-width="1.5"/>
    <text x="150" y="26" text-anchor="middle" font-size="14" fill="#f59e0b">&#9728;</text>
    <text x="150" y="38" text-anchor="middle" font-size="10" font-weight="600" font-family="sans-serif" fill="#e6edf3">${pw(pvPow) || '—'}</text>
    <text x="150" y="47" text-anchor="middle" font-size="7.5" font-family="sans-serif" fill="#7d8590" letter-spacing="0.6">SOLAR</text>

    <!-- Grid -->
    <rect x="4" y="97" width="72" height="47" rx="8"
          fill="#161b22" stroke="${gridActive ? gridColor : '#30363d'}" stroke-width="1.5"/>
    <text x="40" y="118" text-anchor="middle" font-size="13" fill="${gridActive ? gridColor : '#7d8590'}">&#9889;</text>
    <text x="40" y="129" text-anchor="middle" font-size="9.5" font-weight="600" font-family="sans-serif" fill="#e6edf3">${gridActive ? (pw(impOn ? impPow : expPow) || '—') : fmt(inv.pvgridvoltage, 'V')}</text>
    <text x="40" y="139" text-anchor="middle" font-size="7.5" font-family="sans-serif" fill="#7d8590" letter-spacing="0.6">${impOn ? 'IMPORT' : expOn ? 'EXPORT' : 'GRID'}</text>

    <!-- Home -->
    <rect x="113" y="97" width="74" height="47" rx="8"
          fill="#21262d" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="150" y="118" text-anchor="middle" font-size="13" fill="#93c5fd">&#8962;</text>
    <text x="150" y="129" text-anchor="middle" font-size="9.5" font-weight="600" font-family="sans-serif" fill="#e6edf3">${pw(load) || '—'}</text>
    <text x="150" y="139" text-anchor="middle" font-size="7.5" font-family="sans-serif" fill="#7d8590" letter-spacing="0.6">HOME</text>

    <!-- Battery -->
    <rect x="224" y="97" width="72" height="47" rx="8"
          fill="#161b22" stroke="${socColor}" stroke-width="1.5"/>
    <rect x="236" y="106" width="36" height="18" rx="3" fill="none" stroke="${socColor}" stroke-width="1.2"/>
    <rect x="272"  y="111" width="4"  height="8"  rx="1" fill="${socColor}" opacity="0.5"/>
    <rect x="237.5" y="107.5" width="${Math.round(33 * Math.min(soc, 100) / 100)}" height="15" rx="2" fill="${socColor}" opacity="0.8"/>
    <text x="260" y="130" text-anchor="middle" font-size="9.5" font-weight="600" font-family="sans-serif" fill="#e6edf3">${soc}%</text>
    <text x="260" y="139" text-anchor="middle" font-size="7.5" font-family="sans-serif" fill="#7d8590" letter-spacing="0.6">${chrOn ? 'CHARGING' : disOn ? 'DISCHAR.' : 'BATTERY'}</text>
  </svg>`;
}

// ── Energy today row ──────────────────────────────────────────────────────

function renderEnergyRow(inv) {
  const pvToday  = inv.pvenergytoday ?? inv.eactoday ?? null;
  const fromGrid = inv.etouser_tod ?? null;
  const toGrid   = inv.etogrid_tod ?? null;
  if (pvToday == null && fromGrid == null && toGrid == null) return '';
  return `
    <div class="section-title">Energy today</div>
    <div class="energy-row">
      <div class="energy-tile">
        <div class="energy-icon" style="color:#f59e0b">&#9728;</div>
        <div class="energy-val">${pvToday != null ? (+pvToday).toFixed(1) : '—'}</div>
        <div class="energy-lbl">PV kWh</div>
      </div>
      <div class="energy-tile">
        <div class="energy-icon" style="color:#60a5fa">&#8595;</div>
        <div class="energy-val">${fromGrid != null ? (+fromGrid).toFixed(1) : '—'}</div>
        <div class="energy-lbl">From grid</div>
      </div>
      <div class="energy-tile">
        <div class="energy-icon" style="color:#34d399">&#8593;</div>
        <div class="energy-val">${toGrid != null ? (+toGrid).toFixed(1) : '—'}</div>
        <div class="energy-lbl">To grid</div>
      </div>
    </div>`;
}

// ── Card renderer ─────────────────────────────────────────────────────────

function renderCard(inv) {
  const [statusLabel, statusClass] = STATUS[inv.pvstatus] ?? ['Unknown', 'waiting'];
  const hasSPH   = inv.SOC != null;
  const pvPower  = inv.pvpowerin  ?? null;
  const outPower = inv.pvpowerout ?? inv.pvgridpower ?? null;
  const freq     = inv.pvfrequentie ?? inv.pvfrequency ?? null;
  const temp     = inv.pvtemperature ?? null;
  const loadPow  = inv.plocaloadr ?? null;

  const strings = [1, 2].map(i => {
    const v = inv[`pv${i}voltage`], w = inv[`pv${i}watt`], a = inv[`pv${i}current`];
    if (!v && !w) return '';
    return `<div class="string-card">
      <div class="string-name">String ${i}</div>
      <div class="string-watt">${kw(w)}</div>
      <div class="string-detail">${fmt(v, 'V')} &middot; ${fmt(a, 'A')}</div>
    </div>`;
  }).join('');

  const phases = [
    ['L1', inv.pvgridvoltage,  inv.pvgridcurrent,  inv.pvgridpower],
    ['L2', inv.pvgridvoltage2, inv.pvgridcurrent2, inv.pvgridpower2],
    ['L3', inv.pvgridvoltage3, inv.pvgridcurrent3, inv.pvgridpower3],
  ].filter(([, v]) => v != null && +v !== 0).map(([lbl, v, a, p]) =>
    `<div class="metric"><div class="metric-label">${lbl}</div>
     <div class="metric-value">${fmt(v, 'V')} <small>/ ${fmt(a, 'A')}</small></div>
     <div style="font-size:.75rem;color:var(--muted)">${kw(p)}</div></div>`
  ).join('');

  const powerHero = !hasSPH ? `
    <div class="power-hero">
      <div class="power-block">
        <div class="power-label">PV input</div>
        <div class="power-value">${kw(pvPower)}</div>
        <div class="power-sub">${kw(outPower)} to grid</div>
      </div>
      <div class="power-block" style="text-align:right">
        <div class="power-label">${loadPow != null ? 'Load' : 'Grid out'}</div>
        <div class="power-value" style="font-size:1.5rem">${kw(loadPow ?? outPower)}</div>
        <div class="power-sub">${fmt(temp, '°C')} &nbsp; ${fmt(freq, 'Hz', 2)}</div>
      </div>
    </div>` : '';

  const batStats = hasSPH ? `
    <div class="grid2" style="margin-top:8px">
      <div class="metric"><div class="metric-label">Chr today</div>
        <div class="metric-value">${fmt(inv.eharge1_tod, 'kWh')}</div></div>
      <div class="metric"><div class="metric-label">Dischr today</div>
        <div class="metric-value">${fmt(inv.edischarge1_tod, 'kWh')}</div></div>
    </div>` : '';

  const sphMeta = hasSPH ? `
    <div class="grid2">
      <div class="metric"><div class="metric-label">Grid</div>
        <div class="metric-value">${fmt(inv.pvgridvoltage, 'V')} <small>/ ${fmt(freq, 'Hz', 2)}</small></div></div>
      <div class="metric"><div class="metric-label">Temperature</div>
        <div class="metric-value">${fmt(temp, '°C')}</div></div>
    </div>` : '';

  const ts = new Date(inv.timestamp).toLocaleTimeString();

  return `<div class="card">
    <div class="card-header">
      <div class="device-id">${escHtml(inv.deviceId)}</div>
      <span class="badge badge-${statusClass}">${statusLabel}</span>
    </div>
    ${powerHero}
    ${renderFlowDiagram(inv)}
    ${batStats}
    ${renderEnergyRow(inv)}
    ${sphMeta}
    ${strings ? `<div class="section-title">PV Strings</div><div class="strings">${strings}</div>` : ''}
    ${!hasSPH && phases ? `<div class="section-title">Grid</div><div class="grid2">${phases}</div>` : ''}
    <div class="timestamp">Updated ${escHtml(ts)}${inv.buffered ? ' &middot; buffered' : ''}</div>
  </div>`;
}

// ── Dashboard poll ────────────────────────────────────────────────────────

async function refresh() {
  try {
    const res  = await fetch('/api/dashboard');
    const data = await res.json();
    document.getElementById('status-dot').className = 'dot live';
    document.getElementById('last-update').textContent = new Date().toLocaleTimeString();
    const cards = document.getElementById('cards');
    if (!data.inverters.length) {
      cards.innerHTML = '<div id="no-data"><h2>No inverter data yet</h2><p>Waiting for datalogger connection on port 5279…</p></div>';
    } else {
      cards.innerHTML = data.inverters.map(renderCard).join('');
    }
  } catch {
    document.getElementById('status-dot').className = 'dot err';
    document.getElementById('last-update').textContent = 'connection error';
  }
}

// ── MQTT status badge ─────────────────────────────────────────────────────

async function refreshMqtt() {
  try {
    const res  = await fetch('/api/config/mqtt');
    const data = await res.json();
    const badge = document.getElementById('mqtt-badge');
    const dot   = document.getElementById('mqtt-dot');
    const text  = document.getElementById('mqtt-text');

    if (!data.enabled) {
      badge.hidden = true;
      return;
    }
    badge.hidden = false;
    if (data.connected) {
      dot.className  = 'dot on';
      text.textContent = 'MQTT • ' + data.host + ':' + data.port;
    } else {
      dot.className  = 'dot warn';
      text.textContent = 'MQTT • disconnected';
    }
  } catch { /* server not yet ready */ }
}

refresh();
refreshMqtt();
setInterval(refresh,      5000);
setInterval(refreshMqtt, 15000);
</script>
</body>
</html>
